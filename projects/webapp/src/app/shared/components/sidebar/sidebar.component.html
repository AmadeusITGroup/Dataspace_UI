<df-sidenav
  class="sidebar"
  [searchable]="false"
  [resizable]="false"
  [collapsible]="false"
  [enableMobile]="false"
>
  @for (item of menu; track item.id) {
    @if (!item.items.length) {
      <df-sidenav-link [linkPath]="item.link" [label]="item.title" [icon]="'bi bi-' + item.icon" />
    } @else {
      <!-- Collapsed by default; DF expands a group as soon as one of its links is active. -->
      <df-sidenav-item [label]="item.title" [icon]="'bi bi-' + item.icon" [collapsed]="true">
        @for (subitem of item.items; track subitem.id) {
          <df-sidenav-link [linkPath]="subitem.link" [label]="subitem.title" />
        }
      </df-sidenav-item>
    }
  }
</df-sidenav>
