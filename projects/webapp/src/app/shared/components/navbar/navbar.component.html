<df-topnav>
  <!-- DF's brand link is a router link, so it goes to the app home. -->
  @if (organizationConfig.ORG_LOGO || organizationConfig.ORG_NAME) {
    <df-topnav-brand href="/">
      <ng-template dfTopNavBrandLinkContent>
        @if (organizationConfig.ORG_LOGO) {
          <img
            alt="Link to homepage"
            [ngSrc]="organizationConfig.ORG_LOGO"
            height="40"
            width="40"
          />
        } @else {
          <span class="fw-bold">{{ organizationConfig.ORG_NAME }}</span>
        }
      </ng-template>
    </df-topnav-brand>
  }
  <df-topnav-quick-actions>
    <df-topnav-quick-action>
      <ng-template dfTopNavQuickActionInTopNav>
        <div class="d-flex flex-column align-items-center text-secondary small">
          <i class="icon-nav bi-person-badge fs-5" title="Logged on behalf"></i>
          {{ loginService.shortParticipantId() ?? 'N/A' }}
        </div>
      </ng-template>
    </df-topnav-quick-action>
    <df-topnav-quick-action>
      <ng-template dfTopNavQuickActionInTopNav>
        <button
          type="button"
          class="btn btn-outline-primary df-btn-tertiary"
          (click)="queryClient.invalidateQueries()"
        >
          <span
            class="icon-nav bi-arrow-clockwise icon-refresh"
            aria-hidden="true"
            [class.refreshing]="isRefreshing()"
            (animationiteration)="isFetching() || isRefreshing.set(false)"
          ></span>
          Refresh
        </button>
      </ng-template>
    </df-topnav-quick-action>
    <df-topnav-quick-action>
      <ng-template dfTopNavQuickActionInTopNav>
        <button
          type="button"
          class="btn btn-outline-primary df-btn-tertiary"
          [title]="'Participant id: ' + (loginService.shortParticipantId() ?? 'N/A')"
          (click)="loginService.logOut()"
        >
          <span class="icon-nav bi-box-arrow-left" aria-hidden="true"></span>
          Log out
        </button>
      </ng-template>
    </df-topnav-quick-action>
  </df-topnav-quick-actions>
</df-topnav>
